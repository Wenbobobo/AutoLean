[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "autolean-prover"
version = "0.1.0"
description = "Trustworthy proof-search providers, execution harnesses, and validation gates"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "autolean-contracts>=0.1.0",
  "httpx>=0.28,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autolean_prover"]
