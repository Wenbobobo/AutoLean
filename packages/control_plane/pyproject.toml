[project]
name = "autolean-control-plane"
version = "0.1.0"
description = "Durable event, task, lease, projection, and artifact primitives for AutoLean"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "autolean-contracts>=0.1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autolean_control_plane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
